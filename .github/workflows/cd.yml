name: CD

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/jcrlabs
  IMAGE: barber-back

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub secrets:
#   ARGOCD_SERVER  — ArgoCD server URL
#   ARGOCD_TOKEN   — ArgoCD API token
#   KUBECONFIG     — base64-encoded kubeconfig (only for rollout verify)
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  deploy-prod:
    name: Deploy → prod
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set version from tag
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (${{ env.VERSION }})
        run: |
          docker build -t $REGISTRY/$IMAGE:$VERSION .
          docker push $REGISTRY/$IMAGE:$VERSION

      - name: Checkout main (to update values-prod.yaml)
        uses: actions/checkout@v7
        with:
          ref: main
          path: main-branch

      - name: Update values-prod.yaml
        working-directory: main-branch
        run: |
          sed -i "s/tag: .*/tag: $VERSION/" deploy/helm/values-prod.yaml
          git config user.email "ci@jcrlabs.net"
          git config user.name "CI Bot"
          git add deploy/helm/values-prod.yaml
          git diff --staged --quiet || git commit -m "chore: release $VERSION"
          git push

      - name: ArgoCD sync (prod namespace)
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          curl -sL https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64 \
            -o /usr/local/bin/argocd && chmod +x /usr/local/bin/argocd
          argocd app sync barber-back \
            --server $ARGOCD_SERVER --auth-token $ARGOCD_TOKEN --grpc-web \
            --retry-limit 3 --retry-backoff-duration 15s

      - name: Verify rollout + auto-rollback
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kc
          KUBECONFIG=/tmp/kc kubectl rollout status deployment/barber-back \
            -n barber --timeout=5m || \
          {
            echo "=== Rollout failed — pod diagnostics ==="
            KUBECONFIG=/tmp/kc kubectl get pods -n barber -l app.kubernetes.io/name=barber-back
            KUBECONFIG=/tmp/kc kubectl describe pods -n barber -l app.kubernetes.io/name=barber-back | tail -40
            KUBECONFIG=/tmp/kc kubectl get events -n barber --sort-by='.lastTimestamp' | tail -20
            KUBECONFIG=/tmp/kc kubectl rollout undo deployment/barber-back -n barber
            exit 1
          }
