name: CD

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/jcrlabs
  IMAGE: barber-back

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub secrets:
#   ARGOCD_SERVER  — ArgoCD server URL
#   ARGOCD_TOKEN   — ArgoCD API token
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  deploy-prod:
    name: Deploy → prod
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set version from tag
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (${{ env.VERSION }})
        run: |
          docker build -t $REGISTRY/$IMAGE:$VERSION .
          docker push $REGISTRY/$IMAGE:$VERSION

      - name: Checkout main (to update values-prod.yaml)
        uses: actions/checkout@v7
        with:
          ref: main
          path: main-branch

      - name: Update values-prod.yaml
        working-directory: main-branch
        run: |
          sed -i "s/tag: .*/tag: $VERSION/" deploy/helm/values-prod.yaml
          git config user.email "ci@jcrlabs.net"
          git config user.name "CI Bot"
          git add deploy/helm/values-prod.yaml
          git diff --staged --quiet || git commit -m "chore: release $VERSION"
          git push

      - name: ArgoCD sync (prod namespace)
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          curl -sL https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64 \
            -o /usr/local/bin/argocd && chmod +x /usr/local/bin/argocd
          argocd app sync barber-back \
            --server $ARGOCD_SERVER --auth-token $ARGOCD_TOKEN --grpc-web \
            --retry-limit 3 --retry-backoff-duration 15s

      # La API de Kubernetes no se expone a internet: verificamos el despliegue a través de ArgoCD.
      - name: Verify rollout (ArgoCD)
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          curl -sSfL https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64 -o /usr/local/bin/argocd
          chmod +x /usr/local/bin/argocd
          argo() { argocd --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_TOKEN" --grpc-web "$@"; }
          if ! argo app get barber-back --refresh > /dev/null; then
            echo "::warning::No se pudo consultar la app barber-back en ArgoCD; no hay despliegue que verificar"
            exit 0
          fi
          argo app wait barber-back --sync --health --timeout 300 || { argo app get barber-back; exit 1; }
