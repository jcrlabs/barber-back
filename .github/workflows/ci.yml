name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: barber
          POSTGRES_PASSWORD: barber
          POSTGRES_DB: barber_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U barber"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ── Integrity ────────────────────────────────────────────────────────────
      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # ── Formatting ───────────────────────────────────────────────────────────
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # ── Static analysis ──────────────────────────────────────────────────────
      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Secrets scan
        run: |
          if grep -rn --include="*.go" -E "(api_key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}" . | grep -v "_test.go"; then
            echo "Possible hardcoded secret"; exit 1
          fi

      # ── Tests (unit + integración contra Postgres) ───────────────────────────
      - name: Test (race + coverage)
        env:
          TEST_DATABASE_URL: postgres://barber:barber@localhost:5432/barber_test?sslmode=disable
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build binary
        run: go build -o /dev/null ./cmd/server

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/helm -f deploy/helm/values.yaml -f deploy/helm/values-prod.yaml
          helm lint deploy/helm -f deploy/helm/values.yaml -f deploy/helm/values-test.yaml
