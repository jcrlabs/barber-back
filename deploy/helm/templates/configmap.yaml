apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "barber-back.fullname" . }}-config
  labels:
    {{- include "barber-back.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.env | quote }}
  PORT: {{ .Values.service.port | quote }}
  PUBLIC_URL: {{ required "config.publicUrl is required" .Values.config.publicUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  TRUSTED_PROXIES: {{ .Values.config.trustedProxies | quote }}
  TRUSTED_PLATFORM: {{ .Values.config.trustedPlatform | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_SSLMODE: {{ .Values.config.dbSslMode | quote }}
  SHOP_TIMEZONE: {{ .Values.config.shopTimezone | quote }}
  SLOT_STEP_MIN: {{ .Values.config.slotStepMin | quote }}
  BOOKING_LEAD_MIN: {{ .Values.config.bookingLeadMin | quote }}
  BOOKING_WINDOW_DAYS: {{ .Values.config.bookingWindowDays | quote }}
  CANCEL_WINDOW_MIN: {{ .Values.config.cancelWindowMin | quote }}
  MAX_ACTIVE_APPOINTMENTS: {{ .Values.config.maxActiveAppointments | quote }}
  SEED_DEMO_DATA: {{ .Values.config.seedDemoData | quote }}
